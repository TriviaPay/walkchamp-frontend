title = "WalkChamp frontend"

[extend]
useDefault = true

[allowlist]
description = "Publishable client IDs, env placeholders, local Backend checkout, and AsyncStorage key names — not secrets"
paths = [
  '''(^|/)eas\.json$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)node_modules/''',
  '''(^|/)android/''',
  '''(^|/)\.expo/''',
  '''(^|/)ios/''',
  '''(^|/)Backend/''',
  '''(^|/)gitleaks(-.*)?\.(json|zip|exe|tgz)$''',
]
regexes = [
  '''EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY''',
  '''EXPO_PUBLIC_RAZORPAY_KEY_ID''',
  '''pk_(test|live)_[A-Za-z0-9]+''',
  '''rzp_(test|live)_[A-Za-z0-9]+''',
  '''walkchamp_[a-z0-9_]+_v\d+''',
]
